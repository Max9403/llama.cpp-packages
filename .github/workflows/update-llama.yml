name: Update llama.cpp-cuda

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pinned commit and package version
        shell: bash
        run: |
          set -euo pipefail

          git clone --branch customized --single-branch \
            https://github.com/Max9403/llama.cpp.git /tmp/llama-source
          git -C /tmp/llama-source fetch --tags origin

          custom_tag=
          base_tag=
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^(c[1-9][0-9]*)\.(b[0-9]+)$ ]]; then
              custom_tag=$tag
              base_tag=${BASH_REMATCH[2]}
              break
            fi
          done < <(git -C /tmp/llama-source tag --merged HEAD \
            --list 'c[0-9]*.b[0-9]*' --sort=-version:refname)

          if [[ -z "$custom_tag" ]]; then
            echo 'No cN.bNNN release tag is reachable from customized.' >&2
            exit 1
          fi
          if [[ -z "$base_tag" ]]; then
            echo "No bN upstream tag is reachable from $custom_tag." >&2
            exit 1
          fi

          grep -q '^_basever=' PKGBUILD
          grep -q '^_customver=' PKGBUILD
          grep -Fq '#tag=${_customver}' PKGBUILD
          sed -i -E \
            -e "s/^_basever=.*/_basever=$base_tag/" \
            -e "s/^_customver=.*/_customver=$custom_tag/" \
            PKGBUILD

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/pkg" -w /pkg archlinux:base-devel \
            sh -c 'makepkg --printsrcinfo > .SRCINFO'

          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update llama.cpp-cuda to ${base_tag}.${custom_tag}"
            git push
          fi
