name: Update llama.cpp-cuda

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pinned commit and package version
        shell: bash
        run: |
          set -euo pipefail

          git clone --branch customized --single-branch \
            https://github.com/Max9403/llama.cpp.git /tmp/llama-source
          git -C /tmp/llama-source fetch --tags origin

          release_tag=
          customver=
          basever=

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^(c[1-9][0-9]*)\.(b[0-9]+)$ ]]; then
              release_tag=$tag
              customver=${BASH_REMATCH[1]}
              basever=${BASH_REMATCH[2]}
              break
            fi
          done < <(git -C /tmp/llama-source tag --merged HEAD \
            --list 'c[0-9]*.b[0-9]*' --sort=-version:refname)

          [[ -n "$release_tag" ]] || {
            echo 'No cX.bY release tag is reachable from customized.' >&2
            exit 1
          }

          grep -q '^_basever=' PKGBUILD
          grep -q '^_customver=' PKGBUILD
          grep -Fq '#tag=${_customver}.${_basever}' PKGBUILD

          sed -i -E \
            -e "s/^_basever=.*/_basever=$basever/" \
            -e "s/^_customver=.*/_customver=$customver/" \
            PKGBUILD

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/pkg" -w /pkg archlinux:base-devel \
            sh -c 'makepkg --printsrcinfo > .SRCINFO'

          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update llama.cpp-cuda to ${base_tag}.${custom_tag}"
            git push
          fi
