name: Update llama.cpp-cuda

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pinned commit and package version
        shell: bash
        run: |
          set -euo pipefail

          git clone --branch customized --single-branch \
            https://github.com/Max9403/llama.cpp.git /tmp/llama-source
          git -C /tmp/llama-source fetch --tags origin

          version=$(
            git -C /tmp/llama-source tag --merged HEAD --list 'b*.custom*' |
              grep -E '^b[0-9]+\.custom[0-9]+$' |
              sort -V |
              tail -n 1
          )

          test -n "$version"
          sed -i -E "s/^pkgver=.*/pkgver=$version/" PKGBUILD

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/pkg" -w /pkg \
            archlinux:base-devel \
            sh -c 'makepkg --printsrcinfo > .SRCINFO'

          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update llama.cpp-cuda to $version"
            git push
          fi
